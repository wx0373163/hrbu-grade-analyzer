name: 构建桌面安装包

# 触发：
#   - 推送到 main 分支：仅构建并上传 Artifacts（用于测试，不发布 Release）
#   - 推送 v* 标签（如 v2.0.1）：构建双平台安装包并自动发布到 GitHub Release
#   - 手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 允许工作流内的 GITHUB_TOKEN 写入 Release / 诊断日志分支
permissions:
  contents: write

# 禁止 electron-builder 在 macOS 上自动寻找代码签名证书（云端无证书，避免卡死）
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-windows:
    name: Windows 安装包 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖（严格按 package-lock.json，确保与本机验证过的版本一致）
        run: npm ci

      - name: 生成图标 (PNG -> ico/icns)
        shell: bash
        run: |
          python build/make_icon.py
          node build/make_icons.js

      - name: 构建 Windows 安装包
        id: build_win
        shell: bash
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build_win.log

      - name: 上传 Windows 安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe

      - name: 诊断 - 上传失败日志 (contents API)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          TOK=os.environ['GH_TOKEN']; REPO=os.environ['GH_REPO']
          H={"Authorization":f"token {TOK}","Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"}
          p='build_win.log'
          data=open(p,'rb').read() if os.path.exists(p) else b'(no log)'
          content=base64.b64encode(data).decode()
          # 创建 diag-logs 分支（已存在则忽略）
          try:
              req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/git/refs",data=json.dumps({"ref":"refs/heads/diag-logs","sha":os.popen('git rev-parse HEAD').read().strip()}).encode(),headers=H,method='POST')
              urllib.request.urlopen(req,timeout=30).read()
          except Exception as e:
              pass
          # 获取现有 sha
          sha=''
          try:
              req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/ci-logs/build_win.log?ref=diag-logs",headers=H)
              sha=json.loads(urllib.request.urlopen(req,timeout=30).read()).get('sha','')
          except Exception:
              pass
          body={"message":"diag windows","content":content,"branch":"diag-logs"}
          if sha: body["sha"]=sha
          req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/ci-logs/build_win.log",data=json.dumps(body).encode(),headers=H,method='PUT')
          print(urllib.request.urlopen(req,timeout=30).read().decode()[:200])
          PY

  build-macos:
    name: macOS 安装包 (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖（严格按 package-lock.json）
        run: npm ci

      - name: 生成图标 (PNG -> ico/icns)
        shell: bash
        run: |
          python build/make_icon.py
          node build/make_icons.js

      - name: 构建 macOS 安装包 (Intel + Apple 芯片)
        id: build_mac
        shell: bash
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build_mac.log

      - name: 上传 macOS 安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg

      - name: 诊断 - 上传失败日志 (contents API)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          TOK=os.environ['GH_TOKEN']; REPO=os.environ['GH_REPO']
          H={"Authorization":f"token {TOK}","Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"}
          p='build_mac.log'
          data=open(p,'rb').read() if os.path.exists(p) else b'(no log)'
          content=base64.b64encode(data).decode()
          try:
              req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/git/refs",data=json.dumps({"ref":"refs/heads/diag-logs","sha":os.popen('git rev-parse HEAD').read().strip()}).encode(),headers=H,method='POST')
              urllib.request.urlopen(req,timeout=30).read()
          except Exception as e:
              pass
          sha=''
          try:
              req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/ci-logs/build_mac.log?ref=diag-logs",headers=H)
              sha=json.loads(urllib.request.urlopen(req,timeout=30).read()).get('sha','')
          except Exception:
              pass
          body={"message":"diag macos","content":content,"branch":"diag-logs"}
          if sha: body["sha"]=sha
          req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/ci-logs/build_mac.log",data=json.dumps(body).encode(),headers=H,method='PUT')
          print(urllib.request.urlopen(req,timeout=30).read().decode()[:200])
          PY

  release:
    name: 发布到 GitHub Release
    needs: [build-windows, build-macos]
    # 仅在推送 v* 标签时发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载双平台安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-installer'
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts/

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: false
