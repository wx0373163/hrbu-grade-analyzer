name: 构建桌面安装包

# 触发：推送到 main 分支、打 v* 标签、或手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 允许工作流内的 GITHUB_TOKEN 推送诊断日志分支
permissions:
  contents: write

# 禁止 electron-builder 在 macOS 上自动寻找代码签名证书（云端无证书，避免卡死）
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-windows:
    name: Windows 安装包 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖（严格按 package-lock.json，确保与本机验证过的版本一致）
        run: npm ci

      - name: 生成图标 (PNG -> ico/icns)
        shell: bash
        run: |
          python build/make_icon.py
          node build/make_icons.js

      - name: 构建 Windows 安装包
        id: build_win
        shell: bash
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build_win.log

      - name: 上传 Windows 安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe

      - name: 诊断 - 提交失败日志到 diag-logs 分支
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p ci-logs
          if [ -f build_win.log ]; then cp build_win.log ci-logs/build_win.log; else echo "无日志" > ci-logs/build_win.log; fi
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add ci-logs/build_win.log
          git commit -m "diag: windows build log" || echo "无变更可提交"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD:diag-logs --force

  build-macos:
    name: macOS 安装包 (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖（严格按 package-lock.json）
        run: npm ci

      - name: 生成图标 (PNG -> ico/icns)
        shell: bash
        run: |
          python build/make_icon.py
          node build/make_icons.js

      - name: 构建 macOS 安装包 (Intel + Apple 芯片)
        id: build_mac
        shell: bash
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build_mac.log

      - name: 上传 macOS 安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg

      - name: 诊断 - 提交失败日志到 diag-logs 分支
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p ci-logs
          if [ -f build_mac.log ]; then cp build_mac.log ci-logs/build_mac.log; else echo "无日志" > ci-logs/build_mac.log; fi
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add ci-logs/build_mac.log
          git commit -m "diag: macos build log" || echo "无变更可提交"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD:diag-logs --force
